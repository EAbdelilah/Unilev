name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Test and Deploy Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests (pre-deploy check)
        run: npm test -- --no-coverage
        timeout-minutes: 5

      - name: Build dashboard
        run: npm run build
        timeout-minutes: 10
        env:
          # Public env vars are baked at build time; set required NEXT_PUBLIC_* secrets/vars in repo settings if needed.
          NEXT_PUBLIC_CHAIN_ID: ${{ vars.NEXT_PUBLIC_CHAIN_ID || '8453' }}

      - name: Deploy to Vercel (Production)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./dashboard
